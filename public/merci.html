<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Message envoyé — Matavai Studio</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; --cream: #f7f1e8; --ocean: #12355b; --pink: #f9b8c4; --violet: #7b61a8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: var(--cream); color: var(--ocean); font-family: "Work Sans", sans-serif; }
      body::before, body::after { content: ""; position: fixed; border-radius: 50%; pointer-events: none; }
      body::before { width: min(52vw, 700px); aspect-ratio: 1; top: -28vw; right: -16vw; background: var(--pink); opacity: .75; }
      body::after { width: min(36vw, 500px); aspect-ratio: 1; bottom: -22vw; left: -10vw; background: var(--violet); opacity: .9; }
      main { position: relative; z-index: 1; width: min(720px, calc(100% - 40px)); padding: clamp(42px, 8vw, 78px); border: 1px solid rgba(18, 53, 91, .16); border-radius: 28px; background: rgba(247, 241, 232, .88); box-shadow: 0 28px 80px rgba(18, 53, 91, .12); text-align: center; backdrop-filter: blur(18px); }
      img { width: min(230px, 58vw); height: auto; margin-bottom: clamp(34px, 6vw, 56px); }
      p:first-of-type { margin: 0 0 14px; color: var(--violet); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 560px; margin: 0 auto 22px; font-family: "Bricolage Grotesque", sans-serif; font-size: clamp(42px, 8vw, 76px); font-weight: 600; letter-spacing: -.055em; line-height: .95; }
      .message { max-width: 470px; margin: 0 auto 38px; font-size: clamp(16px, 2.3vw, 19px); line-height: 1.65; }
      a { display: inline-flex; align-items: center; gap: 16px; padding: 14px 24px; border-radius: 999px; background: var(--ocean); color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; transition: transform .2s ease, background .2s ease; }
      a:hover { background: var(--violet); transform: translateY(-2px); }
      a:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
      @media (max-width: 560px) {
        body::before { top: -18vw; right: -28vw; }
        body::after { bottom: -10vw; left: -26vw; }
        main { padding: 42px 24px; border-radius: 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/matavai-studio-logo.png" alt="Matavai Studio" width="492" height="261" />
      <p>Votre message est parti</p>
      <h1>Merci pour votre confiance.</h1>
      <p class="message">Je reviens vers vous rapidement pour découvrir votre projet et imaginer la suite ensemble.</p>
      <a href="/">Retour au portfolio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
