<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Va’a, la pirogue polynésienne</title>
    <style>
      :root {
        --bg: #e9f1f1;
        --ink: #10343a;
        --muted: #5b7a7e;
        --accent: #0f9aa8;
        --control: #ffffff;
        --shadow: rgba(16, 52, 58, 0.22);
        font-family: Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        overflow: hidden;
        padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
      }
      .stage { min-height: 0; display: flex; align-items: center; justify-content: center; flex: 1; }
      #book { filter: drop-shadow(0 18px 30px var(--shadow)); }
      .page { overflow: hidden; background: #fff; }
      .page img { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; }
      .bar { padding-top: 12px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px; }
      .bar button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(16, 52, 58, 0.14);
        border-radius: 50%;
        background: var(--control);
        color: var(--ink);
        cursor: pointer;
      }
      .bar button:hover { border-color: var(--accent); color: var(--accent); }
      .bar button:disabled { opacity: 0.35; cursor: default; }
      .count { min-width: 96px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
      .credit { margin: 0; padding-top: 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-align: center; text-transform: uppercase; }
      .hint { position: absolute; right: 0; bottom: calc(84px + env(safe-area-inset-bottom)); left: 0; color: var(--muted); font-size: 13px; text-align: center; pointer-events: none; transition: opacity 0.6s; }
    </style>
  </head>
  <body>
    <div class="stage"><div id="book"></div></div>
    <p class="hint" id="hint">Cliquez ou faites glisser le coin des pages</p>
    <div class="bar">
      <button id="first" aria-label="Couverture" title="Couverture">⇤</button>
      <button id="prev" aria-label="Page précédente" title="Page précédente">←</button>
      <span class="count" id="count">1 / 20</span>
      <button id="next" aria-label="Page suivante" title="Page suivante">→</button>
      <button id="last" aria-label="Dernière page" title="Dernière page">⇥</button>
    </div>
    <p class="credit">Va’a, la pirogue polynésienne · Matavai Studio</p>
    <script src="./page-flip.browser.js"></script>
    <script>
      (function () {
        var TOTAL = 20;
        var book = document.getElementById("book");
        for (var i = 1; i <= TOTAL; i++) {
          var page = document.createElement("div");
          page.className = "page";
          if (i === 1 || i === TOTAL) page.setAttribute("data-density", "hard");
          var image = document.createElement("img");
          image.alt = "Page " + i;
          image.dataset.src = i === TOTAL
            ? "/docs/previews/vaa-pirogue/page-20-madame-k.jpg"
            : "/docs/previews/vaa-pirogue/page-" + i + ".jpg";
          image.decoding = "async";
          page.appendChild(image);
          book.appendChild(page);
        }
        var images = book.querySelectorAll("img");
        function load(around) {
          for (var index = Math.max(0, around - 3); index <= Math.min(TOTAL - 1, around + 5); index++) {
            var image = images[index];
            if (!image.src) image.src = image.dataset.src;
          }
        }
        load(0);
        var pageFlip = new St.PageFlip(book, {
          width: 430,
          height: 608,
          size: "stretch",
          minWidth: 240,
          maxWidth: 910,
          minHeight: 340,
          maxHeight: 1287,
          showCover: true,
          usePortrait: true,
          maxShadowOpacity: 0.35,
          mobileScrollSupport: false,
          flippingTime: 800
        });
        pageFlip.loadFromHTML(book.querySelectorAll(".page"));
        var count = document.getElementById("count");
        function update() {
          var page = pageFlip.getCurrentPageIndex();
          load(page);
          var portrait = pageFlip.getOrientation() === "portrait";
          count.textContent = ((portrait || page === 0 || page === TOTAL - 1) ? page + 1 : (page + 1) + "–" + (page + 2)) + " / " + TOTAL;
          document.getElementById("prev").disabled = document.getElementById("first").disabled = page === 0;
          document.getElementById("next").disabled = document.getElementById("last").disabled = page >= TOTAL - (portrait ? 1 : 2);
        }
        pageFlip.on("flip", function () {
          update();
          document.getElementById("hint").style.opacity = 0;
        });
        pageFlip.on("changeOrientation", update);
        document.getElementById("prev").onclick = function () { pageFlip.flipPrev(); };
        document.getElementById("next").onclick = function () { pageFlip.flipNext(); };
        document.getElementById("first").onclick = function () { pageFlip.turnToPage(0); update(); };
        document.getElementById("last").onclick = function () { pageFlip.turnToPage(TOTAL - 1); update(); };
        document.addEventListener("keydown", function (event) {
          if (event.key === "ArrowRight") pageFlip.flipNext();
          if (event.key === "ArrowLeft") pageFlip.flipPrev();
        });
        update();
        setTimeout(function () { document.getElementById("hint").style.opacity = 0; }, 5000);
      })();
    </script>
  </body>
</html>
