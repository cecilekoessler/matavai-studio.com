<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diagnostic Facebook — Matavai Studio</title>
    <style>
      :root { --cream: #f5ede0; --ocean: #12355b; --pink: #f9b8c4; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: var(--cream); color: var(--ocean); font-family: Arial, sans-serif; }
      .viewer { width: 100%; height: 100%; padding: 12px; display: grid; grid-template-rows: minmax(0, 1fr) auto; place-items: center; gap: 10px; }
      #book { max-width: 100%; max-height: 100%; }
      .page { overflow: hidden; background: white; box-shadow: 0 2px 12px rgba(18, 53, 91, .16); }
      .page img { width: 100%; height: 100%; display: block; object-fit: contain; user-select: none; -webkit-user-drag: none; }
      .controls { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 12px; font-weight: 700; }
      .controls button { width: 40px; height: 40px; padding: 0; border: 1px solid var(--ocean); border-radius: 50%; background: var(--ocean); color: white; font-size: 22px; cursor: pointer; }
      .controls button:hover { border-color: var(--pink); background: var(--pink); color: var(--ocean); }
      .controls button:disabled { opacity: .28; cursor: default; }
    </style>
  </head>
  <body>
    <main class="viewer">
      <div id="book"></div>
      <div class="controls" aria-label="Navigation du document">
        <button id="previous" type="button" aria-label="Page précédente">‹</button>
        <span id="counter">1 / 4</span>
        <button id="next" type="button" aria-label="Page suivante">›</button>
      </div>
    </main>
    <script src="/flipbooks/vaa/page-flip.browser.js"></script>
    <script>
      const total = 4
      const book = document.getElementById("book")

      for (let pageNumber = 1; pageNumber <= total; pageNumber += 1) {
        const page = document.createElement("div")
        page.className = "page"
        if (pageNumber === 1 || pageNumber === total) page.dataset.density = "hard"

        const image = document.createElement("img")
        image.src = `pages/${String(pageNumber).padStart(2, "0")}.webp?v=2`
        image.alt = `Page ${pageNumber}`
        image.loading = pageNumber <= 2 ? "eager" : "lazy"
        page.appendChild(image)
        book.appendChild(page)
      }

      const ratio = 1754 / 1240
      const availableWidth = window.innerWidth - 24
      const availableHeight = window.innerHeight - 74
      let pageWidth = availableWidth > 760 ? availableWidth / 2 : availableWidth
      let pageHeight = pageWidth * ratio

      if (pageHeight > availableHeight) {
        pageHeight = availableHeight
        pageWidth = pageHeight / ratio
      }

      const flipbook = new St.PageFlip(book, {
        width: Math.floor(pageWidth),
        height: Math.floor(pageHeight),
        size: "fixed",
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: false,
        maxShadowOpacity: .3,
        flippingTime: 650,
      })

      flipbook.loadFromHTML(document.querySelectorAll(".page"))

      const previous = document.getElementById("previous")
      const next = document.getElementById("next")
      const counter = document.getElementById("counter")

      const updateControls = () => {
        const current = flipbook.getCurrentPageIndex()
        const landscape = flipbook.getOrientation() === "landscape"
        const visible = landscape && current > 0 && current < total - 1
          ? `${current + 1}–${Math.min(current + 2, total)}`
          : `${current + 1}`

        counter.textContent = `${visible} / ${total}`
        previous.disabled = current === 0
        next.disabled = current >= total - 1 || (landscape && current >= total - 2 && current > 0)
      }

      previous.addEventListener("click", () => flipbook.flipPrev())
      next.addEventListener("click", () => flipbook.flipNext())
      flipbook.on("flip", updateControls)
      flipbook.on("changeOrientation", updateControls)
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") flipbook.flipPrev()
        if (event.key === "ArrowRight") flipbook.flipNext()
      })
      updateControls()
    </script>
  </body>
</html>
